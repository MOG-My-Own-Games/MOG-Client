name: Release

# Every push to main computes the version with scripts/version.py, builds the AppImage
# and the Windows exe and attaches them to a DRAFT release tagged v<version>.
# Nothing is published until someone reviews the draft on GitHub and clicks
# "Publish release" (which is also what creates the tag).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.gv.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # version script needs the full history
      - id: gv
        run: python3 scripts/version.py

  appimage:
    needs: version
    # Oldest runner image on purpose: the AppImage uses the host's glibc.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build AppImage
        run: scripts/build-appimage.sh "${{ needs.version.outputs.semver }}"
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/*.AppImage
          if-no-files-found: error

  windows-exe:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build exe
        shell: pwsh
        run: scripts\build-exe.ps1 -Version "${{ needs.version.outputs.semver }}"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/*.exe
          if-no-files-found: error

  draft-release:
    needs: [version, appimage, windows-exe]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.semver }}
          target_commitish: ${{ github.sha }}
          name: MOG Client v${{ needs.version.outputs.semver }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*
