name: Release

# Every push computes the version with scripts/version.py, builds the AppImage
# and the Windows exe and attaches them to a release tagged v<version>, published at once.
# On a branch other than main the version carries the branch name (v0.43.1-feat-save-sync)
# and the release is marked as a pre-release, so it can never become the "latest" release
# that the self-updater looks at.
# The release body is written by scripts/release_notes.py from the commits since the previous release (see
# docs/RELEASING.md); the same notes are bundled into the builds as mog_client/_changelog.py for the Changelog tab.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.gv.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # version script needs the full history
      - id: gv
        run: python3 scripts/version.py
      - name: Release notes
        run: |
          mkdir notes
          python3 scripts/release_notes.py --repo "${{ github.repository }}" --version "${{ steps.gv.outputs.version }}" \
            --header .github/release-header.md --body notes/RELEASE.md --module notes/_changelog.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-body
          path: notes/RELEASE.md
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: notes/_changelog.py
          if-no-files-found: error

  appimage:
    needs: version
    # Oldest runner image on purpose: the AppImage uses the host's glibc.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: changelog
          path: mog_client
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build AppImage
        run: scripts/build-appimage.sh "${{ needs.version.outputs.semver }}"
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/*.AppImage
          if-no-files-found: error

  windows-exe:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: changelog
          path: mog_client
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build exe
        shell: pwsh
        run: scripts\build-exe.ps1 -Version "${{ needs.version.outputs.semver }}"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/*.exe
          if-no-files-found: error

  release:
    needs: [version, appimage, windows-exe]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "{appimage,windows-exe}"
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: release-body
          path: notes
      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS.txt
      # The updater checks this signature against the key built into the app (docs/RELEASING.md). Without the secret the
      # release is left unsigned, which an app with a key built in refuses to install.
      - uses: actions/checkout@v4
        with:
          path: source
      - name: Sign the checksums
        env:
          MOG_RELEASE_SIGNING_KEY: ${{ secrets.MOG_RELEASE_SIGNING_KEY }}
          MOG_SIGNING_OPTIONAL: "1"
        run: python3 source/scripts/sign-release.py artifacts/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.semver }}
          target_commitish: ${{ github.sha }}
          name: MOG Client v${{ needs.version.outputs.semver }}
          draft: false
          prerelease: ${{ github.ref_name != 'main' }}
          body_path: notes/RELEASE.md
          fail_on_unmatched_files: true
          files: artifacts/*
