name: Release

# A pushed tag like v0.2.0 builds the AppImage and the Windows exe and
# attaches them to a DRAFT release. Nothing is published until someone
# reviews the draft on GitHub and clicks "Publish release".
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag the draft release is created for (must be a v* name, created if missing)
        required: true

permissions:
  contents: read

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  appimage:
    # Oldest runner image on purpose: the AppImage uses the host's glibc.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build AppImage
        run: scripts/build-appimage.sh "${TAG#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/*.AppImage
          if-no-files-found: error

  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build exe
        shell: pwsh
        run: scripts\build-exe.ps1 -Version "$($env:TAG.TrimStart('v'))"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/*.exe
          if-no-files-found: error

  draft-release:
    needs: [appimage, windows-exe]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: MOG Client ${{ env.TAG }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*
