[project]
name = "mog-client"
version = "0.1.0"
description = "MOG Client: GUI and CLI to browse, install and launch games from a MOG-Server"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
build = ["pyinstaller>=6.6", "pillow"]
dev = ["mcp[cli]>=1.2", "httpx>=0.27"]

[project.scripts]
mog = "mog_client.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mog_client"]

[tool.ruff]
line-length = 110
target-version = "py310"
