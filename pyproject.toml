[project]
name = "mog-client"
version = "0.1.0"
description = "MOG Client: CLI to drive a MOG-Server install (stdlib only)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["mcp[cli]>=1.2", "httpx>=0.27"]

[project.scripts]
mog = "mog_client.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mog_client"]

[tool.ruff]
line-length = 110
target-version = "py310"
